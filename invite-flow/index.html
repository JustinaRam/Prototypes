<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Invite flow – prototype</title>
<style>
  :root {
    --blue: #2f6bff;
    --blue-soft: #e8efff;
    --orange: #f07a1a;
    --orange-soft: #fff1e5;
    --green: #1fb46b;
    --text: #15171c;
    --muted: #7a808c;
    --line: #eceef2;
    --bg: #f5f6f8;
    --card: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: #dfe3ea;
    display: flex; align-items: center; justify-content: center;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }

  /* Phone frame (collapses to full screen on small devices) */
  .phone {
    position: relative; overflow: hidden; overflow: clip;
    width: 390px; height: 844px;
    background: var(--card);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(20, 30, 60, .25), 0 0 0 10px #111;
  }
  @media (max-width: 480px) {
    body { background: var(--card); }
    .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
  }

  .statusbar {
    height: 47px; padding: 14px 28px 0; display: flex; justify-content: space-between;
    font-size: 15px; font-weight: 600;
  }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }
  .statusbar .icons span { display: inline-block; background: var(--text); border-radius: 2px; }

  /* Screens */
  .screen {
    position: absolute; inset: 47px 0 0 0;
    display: flex; flex-direction: column;
    background: var(--card);
    transition: transform .32s cubic-bezier(.2, .8, .2, 1);
  }
  .screen.hidden-right { transform: translateX(100%); }
  .screen.hidden-left { transform: translateX(-30%); }
  .screen.sheet { transition: transform .36s cubic-bezier(.2, .8, .2, 1); }
  .screen.sheet.hidden-down { transform: translateY(100%); }

  .nav {
    height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .nav .title { flex: 1; text-align: center; font-weight: 600; font-size: 17px; }
  .nav .side { width: 72px; display: flex; }
  .nav .side.right { justify-content: flex-end; }
  .link { color: var(--blue); font-size: 16px; font-weight: 500; }
  .link:disabled { color: #b8c2d6; cursor: default; }
  .back { display: flex; align-items: center; gap: 2px; color: var(--blue); font-size: 16px; }

  .large-title { padding: 4px 20px 12px; display: flex; align-items: center; justify-content: space-between; }
  .large-title h1 { margin: 0; font-size: 30px; letter-spacing: -.5px; }

  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .scroll::-webkit-scrollbar { display: none; }

  .search {
    margin: 4px 16px 10px; height: 38px; border-radius: 10px; background: var(--bg);
    display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--muted); flex-shrink: 0;
  }
  .search input { flex: 1; border: 0; outline: 0; background: none; font: inherit; font-size: 16px; color: var(--text); }

  .section-label {
    padding: 16px 20px 6px; font-size: 13px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .4px;
  }

  .row {
    display: flex; align-items: center; gap: 12px; padding: 10px 20px; width: 100%; text-align: left;
    position: relative;
  }
  .row + .row::before {
    content: ""; position: absolute; top: 0; left: 72px; right: 0; border-top: 1px solid var(--line);
  }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .row .sub { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 15px; position: relative;
  }
  .avatar.sm { width: 52px; height: 52px; font-size: 17px; }

  .badge {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; line-height: 16px;
  }
  .badge.invited { background: var(--blue-soft); color: var(--blue); }
  .badge.external { background: var(--orange-soft); color: var(--orange); }

  .check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid #c9ced8; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .check svg { opacity: 0; transform: scale(.6); transition: all .15s; }
  .row.selected .check { background: var(--blue); border-color: var(--blue); }
  .row.selected .check svg { opacity: 1; transform: scale(1); }

  /* Selected chips */
  .chips {
    display: flex; gap: 14px; overflow-x: auto; padding: 0 16px; flex-shrink: 0;
    max-height: 0; transition: max-height .25s, padding .25s;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips.open { max-height: 90px; padding: 6px 16px 10px; }
  .chip { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 56px; flex-shrink: 0; font-size: 12px; }
  .chip span.label { max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .chip .x {
    position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; border-radius: 50%;
    background: #8a909c; border: 2px solid #fff; display: flex; align-items: center; justify-content: center;
  }

  /* Bottom action bar */
  .bottom {
    padding: 12px 16px 30px; border-top: 1px solid var(--line); background: var(--card); flex-shrink: 0;
  }
  .btn {
    width: 100%; height: 50px; border-radius: 14px; background: var(--blue); color: #fff;
    font-weight: 600; font-size: 16px; transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .4; cursor: default; transform: none; }
  .btn.ghost { background: var(--bg); color: var(--text); margin-top: 10px; }

  /* Toggle */
  .toggle { position: relative; width: 51px; height: 31px; flex-shrink: 0; }
  .toggle input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .toggle .track { position: absolute; inset: 0; border-radius: 999px; background: #e3e5ea; transition: background .2s; }
  .toggle .knob {
    position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .2s;
  }
  .toggle input:checked ~ .track { background: var(--green); }
  .toggle input:checked ~ .knob { transform: translateX(20px); }

  .card {
    margin: 0 16px; border-radius: 14px; background: var(--bg); padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .card .info { flex: 1; }
  .card .info b { display: block; font-size: 15px; font-weight: 600; }
  .card .info small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .hint { padding: 10px 20px 0; font-size: 13px; color: var(--muted); line-height: 1.4; }

  .toggle-label { font-size: 12px; color: var(--muted); margin-right: 8px; min-width: 64px; text-align: right; }

  /* Home */
  .home-actions { display: flex; gap: 10px; padding: 0 16px 6px; }
  .pill-btn {
    display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 999px;
    background: var(--blue); color: #fff; font-weight: 600; font-size: 15px;
  }
  .tabbar {
    height: 82px; border-top: 1px solid var(--line); display: flex; justify-content: space-around;
    padding-top: 8px; flex-shrink: 0; background: var(--card);
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); }
  .tab.active { color: var(--blue); }
  .dot-online { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--green); border: 2px solid #fff; }

  /* Success */
  .success { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 32px; text-align: center; }
  .success-icon {
    width: 96px; height: 96px; border-radius: 50%; background: var(--blue); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 14px var(--blue-soft); margin-bottom: 32px; transform: scale(0);
  }
  .success.play .success-icon { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  @keyframes pop { to { transform: scale(1); } }
  .success h2 { margin: 0 0 8px; font-size: 24px; }
  .success p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .stack { display: flex; margin: 24px 0 0; }
  .stack .avatar { width: 36px; height: 36px; font-size: 13px; border: 2px solid #fff; margin-left: -10px; }
  .stack .avatar:first-child { margin-left: 0; }
  .stack .more { background: var(--bg); color: var(--muted); }
  .summary { display: flex; gap: 8px; margin-top: 18px; }

  .empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 14px; }

  .toast {
    position: absolute; left: 50%; bottom: 100px; transform: translate(-50%, 20px); opacity: 0;
    background: rgba(21, 23, 28, .92); color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 12px;
    transition: all .3s; pointer-events: none; white-space: nowrap; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span class="icons">
      <span style="width:17px;height:11px"></span>
      <span style="width:15px;height:11px;border-radius:50% 50% 0 0"></span>
      <span style="width:25px;height:12px;border-radius:3px"></span>
    </span>
  </div>

  <!-- 1. HOME -->
  <section class="screen" id="home">
    <div class="large-title">
      <h1>Members</h1>
      <button class="pill-btn" id="openInvite">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Invite
      </button>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="homeSearch" placeholder="Search members" />
    </div>
    <div class="scroll" id="homeList"></div>
    <nav class="tabbar">
      <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>Chats</div>
      <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m9 12 2 2 4-4"/></svg>Tasks</div>
      <div class="tab active"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>Members</div>
      <div class="tab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Settings</div>
    </nav>
  </section>

  <!-- 2. SELECT PEOPLE -->
  <section class="screen sheet hidden-down" id="select">
    <div class="nav">
      <div class="side"><button class="link" data-action="cancel">Cancel</button></div>
      <div class="title">Invite people <div id="selCount" style="font-size:12px;font-weight:400;color:var(--muted)">0 / 30 selected</div></div>
      <div class="side right"><button class="link" id="selectAll">Select all</button></div>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="selSearch" placeholder="Search name or email" />
    </div>
    <div class="chips" id="chips"></div>
    <div class="scroll" id="peopleList"></div>
    <div class="bottom"><button class="btn" id="toStep2" disabled>Next</button></div>
  </section>

  <!-- 3. INVITE TYPE -->
  <section class="screen hidden-right" id="type">
    <div class="nav">
      <div class="side"><button class="back" data-action="back">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>Back</button></div>
      <div class="title">Invite as</div>
      <div class="side right"></div>
    </div>
    <div class="scroll">
      <div class="card">
        <div class="info">
          <b>Invite all as guests</b>
          <small>Guests only see the chats and tasks they're added to. Turn off to invite as workspace members.</small>
        </div>
        <label class="toggle"><input type="checkbox" id="allGuest" /><span class="track"></span><span class="knob"></span></label>
      </div>
      <div class="hint">Or choose for each person: <b>Guest</b> on = external guest, off = workspace member.</div>
      <div class="section-label" id="typeLabel">People</div>
      <div id="typeList"></div>
      <div style="height:16px"></div>
    </div>
    <div class="bottom"><button class="btn" id="sendInvites">Send invites</button></div>
  </section>

  <!-- 4. SUCCESS -->
  <section class="screen hidden-right" id="done">
    <div class="success" id="successBody">
      <div class="success-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </div>
      <h2 id="successTitle">Invites sent!</h2>
      <p id="successText"></p>
      <div class="stack" id="successStack"></div>
      <div class="summary" id="successSummary"></div>
    </div>
    <div class="bottom" style="border-top:0">
      <button class="btn" id="goHome">Back to home</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
  // ---------- Data (fictional people) ----------
  const COLORS = ["#5b8def", "#f2994a", "#27ae60", "#9b51e0", "#eb5757", "#2d9cdb", "#f2c94c", "#6fcf97", "#bb6bd9", "#56ccf2"];
  const NAMES = [
    "Aiden Brooks", "Bella Carter", "Caleb Dunn", "Daisy Ellis", "Ethan Foster", "Freya Grant",
    "Gavin Hayes", "Hazel Irwin", "Isaac Jensen", "Jade Keller", "Kai Lawson", "Luna Moreno",
    "Mason Nash", "Nora Owens", "Oliver Price", "Piper Quinn", "Quentin Reed", "Ruby Stone",
    "Sam Turner", "Tessa Underwood", "Uma Vance", "Victor Wade", "Willow Xu", "Xavier Young",
    "Yara Zimmer", "Zane Abbott", "Aria Bishop", "Blake Cole", "Chloe Dalton", "Dylan Ember"
  ];
  const MEMBERS = [
    { name: "You", role: "Admin", color: "#2f6bff", online: true },
    { name: "Maya Levin", role: "Product Designer", color: "#27ae60", online: true },
    { name: "Noah Adler", role: "Engineering Lead", color: "#9b51e0" },
    { name: "Lea Shani", role: "Marketing", color: "#f2994a", online: true },
    { name: "Omer Katz", role: "Sales", color: "#eb5757" },
  ];
  const people = NAMES.map((name, i) => ({
    id: i,
    name,
    email: name.toLowerCase().replace(" ", ".") + "@example.com",
    color: COLORS[i % COLORS.length],
  }));

  const initials = n => n.split(" ").map(p => p[0]).join("").slice(0, 2).toUpperCase();
  const avatar = (p, cls = "") => `<div class="avatar ${cls}" style="background:${p.color}">${p.name === "You" ? "Me" : initials(p.name)}${p.online ? '<span class="dot-online"></span>' : ""}</div>`;
  const $ = id => document.getElementById(id);

  // ---------- State ----------
  const selected = new Set();     // ids being selected in the current flow
  const guestFlags = new Map();   // id -> boolean (guest?) in the current flow
  const invited = new Map();      // id -> "member" | "guest" (persisted after success)

  // ---------- Navigation ----------
  function show(id) {
    const order = ["home", "select", "type", "done"];
    const idx = order.indexOf(id);
    order.forEach((s, i) => {
      const el = $(s);
      el.classList.remove("hidden-right", "hidden-left", "hidden-down");
      if (s === "select") {
        if (i > idx) el.classList.add("hidden-down");
        else if (i < idx) el.classList.add("hidden-left");
      } else if (s === "home") {
        // home stays underneath the sheet
      } else if (i > idx) el.classList.add("hidden-right");
      else if (i < idx) el.classList.add("hidden-left");
    });
    // keep z-order sane; off-screen panels can't take focus
    order.forEach((s, i) => {
      $(s).style.zIndex = i;
      $(s).inert = s !== id && !(s === "home" && id === "select");
    });
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ---------- Home ----------
  function renderHome() {
    const q = $("homeSearch").value.trim().toLowerCase();
    const match = n => !q || n.toLowerCase().includes(q);
    const inv = [...invited.entries()].map(([id, kind]) => ({ ...people[id], kind })).filter(p => match(p.name));
    const mem = MEMBERS.filter(m => match(m.name));

    let html = "";
    if (inv.length) {
      html += `<div class="section-label">Invited · ${inv.length}</div>`;
      html += inv.map(p => `
        <div class="row">
          ${avatar(p)}
          <div class="info">
            <div class="name">${p.name}
              <span class="badge invited">Invited</span>
              ${p.kind === "guest" ? '<span class="badge external">External</span>' : ""}
            </div>
            <div class="sub">${p.email}</div>
          </div>
        </div>`).join("");
    }
    html += `<div class="section-label">Members · ${mem.length}</div>`;
    html += mem.map(m => `
      <div class="row">
        ${avatar(m)}
        <div class="info"><div class="name">${m.name}</div><div class="sub">${m.role}</div></div>
      </div>`).join("");
    if (!inv.length && !mem.length) html = `<div class="empty">No results for “${q}”</div>`;
    $("homeList").innerHTML = html;
  }

  // ---------- Step 1: select ----------
  function renderSelect() {
    const q = $("selSearch").value.trim().toLowerCase();
    const list = people.filter(p => !invited.has(p.id) && (!q || p.name.toLowerCase().includes(q) || p.email.includes(q)));
    const available = people.filter(p => !invited.has(p.id));

    $("peopleList").innerHTML = list.length ? list.map(p => `
      <button class="row ${selected.has(p.id) ? "selected" : ""}" data-id="${p.id}">
        ${avatar(p)}
        <div class="info"><div class="name">${p.name}</div><div class="sub">${p.email}</div></div>
        <span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
      </button>`).join("")
      : `<div class="empty">${available.length ? `No results for “${q}”` : "Everyone has already been invited 🎉"}</div>`;

    const chips = $("chips");
    chips.classList.toggle("open", selected.size > 0);
    chips.innerHTML = [...selected].map(id => {
      const p = people[id];
      return `<button class="chip" data-id="${id}">
        <div class="avatar sm" style="background:${p.color}">${initials(p.name)}
          <span class="x"><svg width="8" height="8" viewBox="0 0 24 24" stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
        </div>
        <span class="label">${p.name.split(" ")[0]}</span>
      </button>`;
    }).join("");

    $("selCount").textContent = `${selected.size} / ${available.length} selected`;
    $("toStep2").disabled = selected.size === 0;
    $("toStep2").textContent = selected.size ? `Next (${selected.size})` : "Next";
    const allSel = available.length > 0 && available.every(p => selected.has(p.id));
    $("selectAll").textContent = allSel ? "Deselect" : "Select all";
    $("selectAll").disabled = available.length === 0;
  }

  function toggleSelect(id) {
    selected.has(id) ? selected.delete(id) : selected.add(id);
    renderSelect();
  }

  $("peopleList").addEventListener("click", e => {
    const row = e.target.closest("[data-id]");
    if (row) toggleSelect(+row.dataset.id);
  });
  $("chips").addEventListener("click", e => {
    const chip = e.target.closest("[data-id]");
    if (chip) toggleSelect(+chip.dataset.id);
  });
  $("selectAll").addEventListener("click", () => {
    const available = people.filter(p => !invited.has(p.id));
    const allSel = available.every(p => selected.has(p.id));
    available.forEach(p => allSel ? selected.delete(p.id) : selected.add(p.id));
    renderSelect();
  });
  $("selSearch").addEventListener("input", renderSelect);

  // ---------- Step 2: invite type ----------
  function renderType() {
    const ids = [...selected];
    $("typeLabel").textContent = `People · ${ids.length}`;
    $("typeList").innerHTML = ids.map(id => {
      const p = people[id];
      const g = guestFlags.get(id);
      return `<div class="row">
        ${avatar(p)}
        <div class="info">
          <div class="name">${p.name}</div>
          <div class="sub" data-sub="${id}">${g ? "Guest · External" : "Workspace member"}</div>
        </div>
        <span class="toggle-label">Guest</span>
        <label class="toggle"><input type="checkbox" data-guest="${id}" ${g ? "checked" : ""}/><span class="track"></span><span class="knob"></span></label>
      </div>`;
    }).join("");
    syncAllGuest();
    updateSendLabel();
  }

  function syncAllGuest() {
    const ids = [...selected];
    $("allGuest").checked = ids.length > 0 && ids.every(id => guestFlags.get(id));
  }

  function updateSendLabel() {
    const n = selected.size;
    $("sendInvites").textContent = `Send ${n} invite${n === 1 ? "" : "s"}`;
  }

  $("typeList").addEventListener("change", e => {
    const id = e.target.dataset.guest;
    if (id === undefined) return;
    guestFlags.set(+id, e.target.checked);
    document.querySelector(`[data-sub="${id}"]`).textContent = e.target.checked ? "Guest · External" : "Workspace member";
    syncAllGuest();
  });
  $("allGuest").addEventListener("change", e => {
    selected.forEach(id => guestFlags.set(id, e.target.checked));
    renderType();
  });

  // ---------- Success ----------
  function renderSuccess(ids) {
    const guests = ids.filter(id => guestFlags.get(id)).length;
    const members = ids.length - guests;
    $("successTitle").textContent = ids.length === 1 ? "Invite sent!" : "Invites sent!";
    $("successText").textContent = ids.length === 1
      ? `${people[ids[0]].name} will get an invite to join your workspace.`
      : `${ids.length} people will get an invite to join your workspace.`;
    const shown = ids.slice(0, 5);
    $("successStack").innerHTML = shown.map(id => avatar(people[id])).join("")
      + (ids.length > shown.length ? `<div class="avatar more">+${ids.length - shown.length}</div>` : "");
    $("successSummary").innerHTML =
      (members ? `<span class="badge invited">${members} workspace member${members === 1 ? "" : "s"}</span>` : "") +
      (guests ? `<span class="badge external">${guests} guest${guests === 1 ? "" : "s"}</span>` : "");
    const body = $("successBody");
    body.classList.remove("play");
    void body.offsetWidth;
    body.classList.add("play");
  }

  // ---------- Wiring ----------
  $("openInvite").addEventListener("click", () => {
    selected.clear();
    guestFlags.clear();
    $("selSearch").value = "";
    renderSelect();
    show("select");
  });
  document.querySelectorAll('[data-action="cancel"]').forEach(b => b.addEventListener("click", () => show("home")));
  document.querySelectorAll('[data-action="back"]').forEach(b => b.addEventListener("click", () => { renderSelect(); show("select"); }));
  $("toStep2").addEventListener("click", () => {
    selected.forEach(id => { if (!guestFlags.has(id)) guestFlags.set(id, false); });
    renderType();
    show("type");
  });
  $("sendInvites").addEventListener("click", () => {
    const ids = [...selected];
    ids.forEach(id => invited.set(id, guestFlags.get(id) ? "guest" : "member"));
    renderSuccess(ids);
    show("done");
  });
  $("goHome").addEventListener("click", () => {
    const n = selected.size;
    selected.clear();
    guestFlags.clear();
    $("homeSearch").value = "";
    renderHome();
    $("homeList").scrollTop = 0;
    show("home");
    toast(`${n} ${n === 1 ? "person" : "people"} invited`);
  });
  $("homeSearch").addEventListener("input", renderHome);

  renderHome();
  show("home");
</script>
</body>
</html>
